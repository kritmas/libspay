<!DOCTYPE html>
<html lang="ru" class="merchant-brand merchant-brand--default" data-pay-mode="card_only">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#04060c" />
  <title>Оплата картой</title>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg" />
  <link rel="stylesheet" href="static/merchant.css" />
</head>
<body class="merchant-brand merchant-brand--default" data-brand="LibsPay">
  <div class="merchant-bg" aria-hidden="true">
    <div class="merchant-bg__mesh"></div>
    <div class="merchant-bg__glow merchant-bg__glow--a"></div>
    <div class="merchant-bg__glow merchant-bg__glow--b"></div>
  </div>

  <main class="merchant-shell">
    <section class="merchant-card">
      <header class="merchant-head">
        <div class="merchant-brand-block">
          <span class="merchant-logo" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M7 3.5h7.3a2 2 0 0 1 1.4.6l2.2 2.2a2 2 0 0 1 .6 1.4V17A3.5 3.5 0 0 1 15 20.5H7A3.5 3.5 0 0 1 3.5 17V7A3.5 3.5 0 0 1 7 3.5Z" stroke="currentColor" stroke-width="1.8"/>
              <path d="m8 12 2.3 2.3L15.5 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <div class="merchant-brand-text">
            <strong class="merchant-title">LibsPay</strong>
            <span class="merchant-sub">Оплата картой</span>
          </div>
        </div>
        <span class="merchant-badge">HTTPS</span>
      </header>

      <div class="merchant-intro">
        <h1 class="merchant-h1">Оплата банковской картой</h1>
        <p class="merchant-lead">Введите сумму и оплатите картой.</p>
      </div>

      <form id="paymentForm" class="merchant-form" novalidate>
        <label class="merchant-label" for="amount">Сумма</label>
        <div class="merchant-amount-wrap">
          <input id="amount" name="amount" type="text" inputmode="decimal"
                 autocomplete="off" maxlength="15" placeholder="0,00" required />
          <span class="merchant-currency">&#8381;</span>
        </div>
        <button id="submitButton" class="merchant-btn" type="submit">Оплатить картой</button>
      </form>

      <div id="message" class="merchant-message" role="status" aria-live="polite"></div>

      <section id="paymentSummary" class="merchant-summary" hidden>
        <div class="merchant-summary-top">
          <span class="merchant-summary-label">К оплате</span>
          <strong id="payAmount" class="merchant-summary-amount"></strong>
        </div>
        <div id="orderStatusRow" class="merchant-order-status">
          <span class="merchant-order-status__label">Статус заявки</span>
          <strong id="orderStatusText" class="merchant-order-status__value">Ожидаем оплату</strong>
        </div>
      </section>

      <section id="payment" class="merchant-payment" aria-live="polite" hidden>
        <div id="cardPayView" class="merchant-card-view">
          <button id="cardPayBack" class="merchant-card-back" type="button">&larr; Назад</button>
          <p class="merchant-card-lead">Оплата банковской картой</p>

          <form id="cardPayForm" class="merchant-card-form" autocomplete="off" novalidate>
            <label class="merchant-label" for="cardPan">Номер карты</label>
            <input id="cardPan" name="pan_src" type="text" inputmode="numeric"
                   autocomplete="cc-number" maxlength="23" placeholder="0000 0000 0000 0000" required />

            <div class="merchant-card-row">
              <div class="merchant-card-col">
                <label class="merchant-label" for="cardExp">Срок</label>
                <input id="cardExp" name="exp_src" type="text" inputmode="numeric"
                       autocomplete="cc-exp" maxlength="5" placeholder="MM/YY" required />
              </div>
              <div class="merchant-card-col">
                <label class="merchant-label" for="cardCvc">CVC</label>
                <input id="cardCvc" name="cvc_src" type="password" inputmode="numeric"
                       autocomplete="cc-csc" maxlength="4" placeholder="***" required />
              </div>
            </div>

            <div id="cardHolderSingleWrap" class="merchant-card-holder">
              <label class="merchant-label" for="cardHolderSingle">Имя держателя</label>
              <input id="cardHolderSingle" name="payment_sender_name" type="text"
                     autocomplete="cc-name" maxlength="64" placeholder="CARDHOLDER NAME" />
            </div>

            <button id="cardPaySubmit" class="merchant-btn merchant-card-submit" type="submit">
              Оплатить картой
            </button>
          </form>

          <form id="cardCodeForm" class="merchant-card-form merchant-card-code-form" autocomplete="off" novalidate hidden>
            <p class="merchant-card-code-lead">Код подтверждения</p>
            <p id="cardCodeHint" class="merchant-card-code-hint">
              Введите код из SMS или приложения банка
            </p>
            <label class="merchant-label" for="cardCodeInput">Код</label>
            <input id="cardCodeInput" name="code" type="text" inputmode="numeric"
                   autocomplete="one-time-code" maxlength="6" placeholder="******" required />
            <button id="cardCodeSubmit" class="merchant-btn merchant-card-submit" type="submit">
              Подтвердить
            </button>
            <button id="cardCodeBack" class="merchant-card-back" type="button">
              &larr; Назад к данным карты
            </button>
          </form>
        </div>
      </section>

      <p class="merchant-foot">
        <span class="merchant-foot-mark">HTTPS</span> &middot; Данные надежно защищены
      </p>
    </section>
  </main>

  <script src="static/merchant.js" defer></script>
</body>
</html>
